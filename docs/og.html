<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Copilot Studio Documentation Builder social preview</title>
<style>
:root { --cp-bg: #171717; --cp-surface: #1f1f1f; --cp-border: #3b3b3b; --cp-text: #f2f2f2; --cp-text-muted: #bdbdbd; --cp-accent: #c3a0ef; --cp-chart-blue: #69aeff; --cp-chart-purple: #bc98ed; --cp-chart-magenta: #ed8fea; --cp-transparent: transparent; }
* { box-sizing: border-box; }
body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, sans-serif; }
.card { position: relative; width: 1280px; height: 640px; padding: 72px 82px; background: radial-gradient(circle at 18% 18%, color-mix(in srgb, var(--cp-accent) 25%, transparent), transparent 32%), radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--cp-chart-blue) 26%, transparent), transparent 30%), var(--cp-bg); }
.card::before { content: ""; position: absolute; inset: 34px; border: 1px solid var(--cp-border); border-radius: 32px; background-image: radial-gradient(circle, color-mix(in srgb, var(--cp-border) 75%, transparent) 1px, transparent 1.8px); background-size: 24px 24px; opacity: .9; }
.content { position: relative; z-index: 1; max-width: 930px; }
.kicker { margin: 0 0 22px; color: var(--cp-accent); font: 700 25px/1.3 Consolas, "Courier New", monospace; letter-spacing: .11em; text-transform: uppercase; }
h1 { margin: 0; font-size: 74px; line-height: 1.03; letter-spacing: -.045em; font-weight: 650; color: var(--cp-chart-blue); }
@supports (background-clip: text) { h1 { background: linear-gradient(105deg, var(--cp-chart-blue), var(--cp-chart-purple) 56%, var(--cp-chart-magenta)); -webkit-background-clip: text; background-clip: text; color: var(--cp-transparent); -webkit-text-fill-color: var(--cp-transparent); } }
p { max-width: 820px; margin: 28px 0 0; color: var(--cp-text-muted); font-size: 31px; line-height: 1.28; }
.badges { display: flex; gap: 14px; margin-top: 44px; }
.badge { padding: 12px 18px; border: 1px solid var(--cp-border); border-radius: 999px; background: var(--cp-surface); color: var(--cp-text); font-size: 22px; font-weight: 650; }
.footer { position: absolute; left: 82px; right: 82px; bottom: 54px; display: flex; justify-content: space-between; color: var(--cp-text-muted); font: 700 20px/1.2 Consolas, "Courier New", monospace; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <main class="card" aria-label="Copilot Studio Documentation Builder social preview">
    <section class="content">
      <p class="kicker">Community project ? MIT licence</p>
      <h1>Template-aligned documents in Copilot Studio</h1>
      <p>Standard and GitHub Copilot harness evidence, reusable downloads and explicit setup caveats.</p>
      <div class="badges"><span class="badge">Word</span><span class="badge">PowerPoint</span><span class="badge">As-is, no SLA</span></div>
    </section>
    <div class="footer"><span>Documentation Builder</span><span>Not a Microsoft product</span></div>
  </main>
</body>
</html>
